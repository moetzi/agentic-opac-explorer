  neo4j:
    image: neo4j:5.25-community
    container_name: neo4j-agentic-graphrag
    ports:
      - "7474:7474"   # Neo4j Browser (HTTP)
      - "7687:7687"   # Bolt
    environment:
      # ${NEO4J_AUTH} is resolved from ../.env via `docker compose --env-file
      # ../.env ...` (see docs/deployment.md) — NOT via `env_file:`, which
      # would inject every var in .env (GROQ_API_KEY, HF_TOKEN, etc.) into
      # this container's runtime environment unnecessarily.
      - NEO4J_AUTH=${NEO4J_AUTH}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_export_file_enabled=true
    volumes:
      - ./neo4j_data:/data
      - ./neo4j_logs:/logs
      - ./neo4j_conf:/conf
      - ../data_pipeline/gold:/var/lib/neo4j/import
    deploy:
      resources:
        limits:
          memory: 1.5g

